services:
  logger.channel.glossary_tooltip:
    parent: logger.channel_base
    arguments: ['glossary_tooltip']

  glossary_tooltip.term_provider:
    class: Drupal\glossary_tooltip\Service\GlossaryTermProvider
    arguments:
      - '@entity_type.manager'
      - '@entity.repository'

  glossary_tooltip.matcher:
    class: Drupal\glossary_tooltip\Service\GlossaryMatcher

  glossary_tooltip.element_builder:
    class: Drupal\glossary_tooltip\Dom\TooltipElementBuilder
    arguments:
      - '@string_translation'

  glossary_tooltip.dom_processor:
    class: Drupal\glossary_tooltip\Dom\GlossaryDomProcessor
    arguments:
      - '@glossary_tooltip.matcher'
      - '@glossary_tooltip.element_builder'

  glossary_tooltip.highlighter:
    class: Drupal\glossary_tooltip\Service\GlossaryHighlighter
    arguments:
      - '@glossary_tooltip.term_provider'
      - '@glossary_tooltip.matcher'
      - '@glossary_tooltip.dom_processor'
      - '@config.factory'
